[project]
name = "ad-agent"
version = "0.2.0"
description = "AI-powered agent for creating, analyzing, and optimizing ad creatives"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.102",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "requests>=2.31",
]

[project.scripts]
ad-agent = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
